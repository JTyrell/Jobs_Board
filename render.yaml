services:
  - type: web
    name: sonajobs-web
    env: docker
    dockerfilePath: ./Dockerfile
    plan: standard
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sonajobs-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      # Important: Let Render assign the PORT dynamically

databases:
  - name: sonajobs-db
    databaseName: sonajobs
    user: sonajobs
    plan: starter
